<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LanternGuard · Manual 3D</title>
<style>
:root{--bg:#eef1f5;--panel:#ffffff;--panel2:#f3f5f9;--ink:#1c2430;--mute:#566274;--line:#d6dbe3;--accent:#1f6feb;--accent-ink:#fff;--seal:#d62828;--scene:#e7ebf1;--chip:#e6ecf5;--ok:#1e8a4c;--warn:#b7791f;--bad:#c0392b;--screw:#f5a300}
:root[data-theme=dark]{--bg:#0f141b;--panel:#171e28;--panel2:#1d2531;--ink:#e6ebf2;--mute:#9db0c4;--line:#2b3544;--accent:#5aa2ff;--accent-ink:#06121f;--seal:#ff5d5d;--scene:#0c1117;--chip:#243044;--ok:#4cc380;--warn:#e3a94b;--bad:#ff7b6b;--screw:#ffc233}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
code{background:var(--chip);padding:0 4px;border-radius:4px;font-size:.92em}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
header{display:flex;gap:10px;align-items:center;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
header h1{font-size:16px;margin:0;white-space:nowrap}
#bTema{margin-left:auto}
header h1 small{display:block;font-size:11px;font-weight:400;color:var(--mute);line-height:1.1}
#tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;border:1px solid transparent;background:transparent;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;letter-spacing:.03em;min-height:38px}
#tabs button:hover{background:var(--panel2)}
#tabs button.on{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--panel2);padding:6px 12px;border-radius:8px;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.red.on{background:var(--seal);border-color:var(--seal);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{min-height:30px;padding:3px 9px;font-size:13px}
#main{flex:1;display:flex;min-height:0}
#panel{width:420px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#pbody{overflow:auto;flex:1;padding:12px 14px 40px;-webkit-overflow-scrolling:touch}
#stage{position:relative;flex:1;background:var(--scene);min-width:0;touch-action:none;overflow:hidden}
#cv{width:100%;height:100%;display:block;outline:none}
#hud{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 20px)}
#hint{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 9px;color:var(--mute);font-size:12px;pointer-events:none;max-width:calc(100% - 20px)}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mute);background:var(--scene);z-index:5}
#sheetbtn{display:none}
h2{font-size:19px;margin:0 0 4px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:18px 0 6px}
p{margin:6px 0}
.lead{color:var(--mute)}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--chip);font-size:12px;margin:0 4px 4px 0}
.chip.red{background:var(--seal);color:#fff}
.chip.ok{background:var(--ok);color:#fff}.chip.warn{background:var(--warn);color:#fff}.chip.bad{background:var(--bad);color:#fff}
.search{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);margin-bottom:8px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.filters button{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px;min-height:32px}
.filters button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sum{color:var(--mute);font-size:13px;margin:4px 0 8px}
.item{display:flex;gap:9px;align-items:center;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--panel2)}
.item.sel{background:var(--chip);border-color:var(--accent)}
.sw{width:13px;height:13px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.25)}
.item .t{flex:1;min-width:0}.item .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{color:var(--mute)}
.badge{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--seal);color:#fff;flex:none}
.badge.blue{background:var(--accent);color:var(--accent-ink)}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);text-align:center;font-weight:700;line-height:28px;font-size:13px}
.num.red{background:var(--seal);color:#fff}
.card{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:10px 12px;margin:8px 0}
.card.sel{border-color:var(--accent);outline:1px solid var(--accent)}
.card.red{border-left:4px solid var(--seal)}
.card .hd{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.card .hd b{display:block}.card .hd small{color:var(--mute);display:block}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:8px 0}
dt{color:var(--mute)}dd{margin:0}
.hole{display:flex;gap:9px;padding:8px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:6px}
.hole:hover,.hole.on{background:var(--chip)}
.hole .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);text-align:center;font-weight:700;line-height:26px;font-size:12px}
.hole .n.c-sello{background:var(--seal);color:#fff}.hole .n.c-cable{background:#e08a00;color:#fff}.hole .n.c-forma{background:#2e9e5b;color:#fff}.hole .n.c-ajuste{background:#8a55d6;color:#fff}.hole .n.c-mont{background:#7b8794;color:#fff}
.hole b{display:block}.hole span{color:var(--mute)}
ol,ul{margin:6px 0;padding-left:22px}li{margin:3px 0}
table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--panel2)}
.stepbox{border:2px solid var(--accent);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--panel2)}
.stepbox h4{margin:0 0 2px;font-size:16px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--accent)}
.fs{font-weight:700}
.fs.ok{color:var(--ok)}.fs.warn{color:var(--warn)}.fs.bad{color:var(--bad)}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.imgs figure{margin:0}.imgs img{width:100%;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.imgs figcaption{font-size:12px;color:var(--mute)}
details{margin:6px 0}summary{cursor:pointer;font-weight:600}
.empty{color:var(--mute);padding:14px 2px}
.back{margin-bottom:8px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:50}
#zoom img{max-width:96vw;max-height:92vh;border-radius:6px;background:#fff}
@media (max-width:860px){
 header{flex-wrap:wrap;padding:6px 8px;gap:4px}
 header h1{font-size:15px}
 #tabs{order:3;flex-basis:100%}
 #main{flex-direction:column}
 #stage{flex:1;min-height:180px}
 #panel{width:100%;height:var(--sheet,46vh);border-right:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.22);flex:none}
 body.sheet-min #panel{height:0;border:0}
 body.sheet-min #pbody{display:none}
 #sheetbtn{display:inline-block}
 #hint{display:none}
 #pbody{padding:10px 12px 40px}
 .imgs{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="app">
 <header>
  <h1>LanternGuard<small>Manual 3D · nodo y boya</small></h1>
  <nav id="tabs"></nav>
  <button class="btn small" id="bTema" title="Cambiar entre modo claro y modo oscuro">Modo oscuro</button>
 </header>
 <div id="main">
  <main id="stage">
   <canvas id="cv" tabindex="0"></canvas>
   <div id="hud">
    <button class="btn small" id="bExp" title="Separa las piezas para verlas una por una">Explotar</button>
    <button class="btn small red" id="bSel" title="Deja casi transparentes las piezas y pinta de rojo las juntas">Ver juntas</button>
    <button class="btn small" id="bVista" title="Volver a ver todo el modelo">Vista completa</button>
    <button class="btn small" id="sheetbtn" title="Mostrar u ocultar el panel">Panel</button>
   </div>
   <div id="tip"></div>
   <div id="hint">Arrastra para girar · rueda o pellizco para acercar · clic derecho o dos dedos para mover · toca una pieza</div>
   <div id="msg">Cargando el modelo…</div>
  </main>
  <aside id="panel"><div id="pbody"></div></aside>
 </div>
</div>
<div id="zoom"><img alt=""></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" id="three-cdn"></script>
<script>
const MODE = /*__MODE__*/null;
let DATA = /*__DATA__*/null;
const GLB_B64 = "__GLB_B64__";
</script>
<script>
(function(){
"use strict";
const T0=performance.now();
const $=s=>document.querySelector(s);
const msg=$("#msg");
function fail(t){msg.style.display="flex";msg.textContent=t;}
if(typeof THREE==="undefined"){fail("No se pudo cargar three.js desde internet. Conéctate y vuelve a abrir esta página.");return;}
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf=(x,d)=>x==null?"—":Number(x).toLocaleString("es",{maximumFractionDigits:d==null?1:d,minimumFractionDigits:0});

// ---------- theme
const root=document.documentElement;let scene=null;
function setTheme(t){root.dataset.theme=t;try{localStorage.setItem("lg-theme",t)}catch(e){}
 $("#bTema").textContent=t==="dark"?"Modo claro":"Modo oscuro";
 if(scene)scene.background=new THREE.Color(t==="dark"?0x0c1117:0xe7ebf1);}
let th=null;try{th=localStorage.getItem("lg-theme")}catch(e){}
if(!th)th=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
root.dataset.theme=th;

// ---------- three setup
const cv=$("#cv"),stage=$("#stage");
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});}catch(e){fail("Tu navegador no puede mostrar 3D (WebGL desactivado).");return;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,0.01,50);
scene.add(new THREE.HemisphereLight(0xffffff,0x667788,0.78));
const dl=new THREE.DirectionalLight(0xffffff,0.75);scene.add(dl);scene.add(dl.target);
const dl2=new THREE.DirectionalLight(0xffffff,0.3);dl2.position.set(-3,-2,-2);scene.add(dl2);
setTheme(th);

// ---------- minimal GLB parser (the cdnjs build of three.js has no GLTFLoader)
function b64bytes(s){const bin=atob(s),n=bin.length,a=new Uint8Array(n);for(let i=0;i<n;i++)a[i]=bin.charCodeAt(i);return a;}
function parseGLB(buf){
 const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);
 if(dv.getUint32(0,true)!==0x46546C67)throw new Error("GLB inválido");
 let off=12,json=null,bin=null;
 while(off<buf.byteLength){const len=dv.getUint32(off,true),typ=dv.getUint32(off+4,true);const s=off+8;
  if(typ===0x4E4F534A)json=JSON.parse(new TextDecoder().decode(buf.subarray(s,s+len)));
  else if(typ===0x004E4942)bin=buf.subarray(s,s+len);off=s+len+((4-len%4)%4);}
 const comp={5120:Int8Array,5121:Uint8Array,5122:Int16Array,5123:Uint16Array,5125:Uint32Array,5126:Float32Array};
 const nc={SCALAR:1,VEC2:2,VEC3:3,VEC4:4};
 function acc(i){const a=json.accessors[i],bv=json.bufferViews[a.bufferView],C=comp[a.componentType],n=nc[a.type];
  const start=(bv.byteOffset||0)+(a.byteOffset||0);const copy=bin.slice(start,start+a.count*n*C.BYTES_PER_ELEMENT);
  return {arr:new C(copy.buffer),n:n};}
 const geoms=json.meshes.map(m=>{const p=m.primitives[0];const pos=acc(p.attributes.POSITION);
  const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(pos.arr,3));
  if(p.indices!==undefined){g.setIndex(new THREE.BufferAttribute(acc(p.indices).arr,1));}
  g.computeBoundingBox();g.computeBoundingSphere();return g;});
 const out=[];
 json.scenes[json.scene||0].nodes.forEach(n=>{(function w(i,parent){const nd=json.nodes[i];const m=new THREE.Matrix4().copy(parent);
  if(nd.matrix)m.multiply(new THREE.Matrix4().fromArray(nd.matrix));
  else{const t=nd.translation||[0,0,0],q=nd.rotation||[0,0,0,1],s=nd.scale||[1,1,1];
   m.multiply(new THREE.Matrix4().compose(new THREE.Vector3(...t),new THREE.Quaternion(...q),new THREE.Vector3(...s)));}
  if(nd.mesh!==undefined)out.push({name:nd.name||json.meshes[nd.mesh].name,geom:geoms[nd.mesh],matrix:m});
  (nd.children||[]).forEach(c=>w(c,m));})(n,new THREE.Matrix4());});
 return out;
}

// ---------- state shared by everything below
let P,meshes={},model=new THREE.Group();
const FAMILY={M1s:"#2f80c9",M2:"#e0a030",M3s:"#2aa198",M3t:"#8e7cc3",M4:"#d9663b",M5s:"#c24b8a",M6:"#6b8e23",M11:"#4aa3a0",
 B1:"#2f80c9",B2:"#3ca36a",B3:"#e0a030",B4:"#d9663b",B5:"#8e7cc3",B6:"#c24b8a"};
function colorOf(name,info){
 if(info.kind==="sello")return "#d62828";
 if(info.kind!=="impresa"){if(name==="REF_umbilical")return "#f08a00";if(/M7/.test(name))return "#7fd0ff";return "#9aa5b1";}
 return FAMILY[name.split("_")[0]]||"#6aa";}
const ghost=i=>i.kind==="ref"&&i.code!=="REF_umbilical";
function build(buf){
 scene.add(model);
 parseGLB(buf).forEach(o=>{
  const info=P[o.name]||{kind:"ref",code:o.name};const gh=ghost(info);
  const col=new THREE.Color(colorOf(o.name,info));
  const op=gh?(/M7/.test(o.name)?.5:.3):1;
  const mat=new THREE.MeshStandardMaterial({color:col,roughness:.62,metalness:.05,flatShading:true,side:THREE.DoubleSide,transparent:gh,opacity:op,depthWrite:!gh});
  const m=new THREE.Mesh(o.geom,mat);m.name=o.name;m.applyMatrix4(o.matrix);
  m.userData={base:m.position.clone(),baseColor:col.clone(),baseOpacity:op,u:0,uT:0,vis:true,info,ghost:gh,markers:null};
  const off=info.offset||[0,0,0];m.userData.off=new THREE.Vector3(off[0],off[1],off[2]);
  meshes[o.name]=m;model.add(m);});
}

// ---------- camera orbit controls (own implementation)
const target=new THREE.Vector3(),sph={r:3,th:0.8,ph:1.15};
let flyTo=null;
function placeCam(){const s=Math.sin(sph.ph);camera.position.set(target.x+sph.r*s*Math.sin(sph.th),target.y+sph.r*Math.cos(sph.ph),target.z+sph.r*s*Math.cos(sph.th));camera.lookAt(target);
 dl.position.copy(camera.position).add(new THREE.Vector3(1,2,1));dl.target.position.copy(target);}
function bboxOf(filter,names){const b=new THREE.Box3();for(const k in meshes){const m=meshes[k];if(names&&!names.includes(k))continue;const u=m.userData;if(filter&&!filter(u))continue;
  b.union(m.geometry.boundingBox.clone().translate(u.base.clone().addScaledVector(u.off,u.uT)));}return b;}
function flyToBox(b,k,now){if(b.isEmpty())return;const c=b.getCenter(new THREE.Vector3()),r=b.getSize(new THREE.Vector3()).length()/2;
 const vf=camera.fov*Math.PI/360,hf=Math.atan(Math.tan(vf)*camera.aspect);   // half angles: fit the narrower one (phones)
 const dist=Math.max(.2,r/Math.sin(Math.min(vf,hf))*(k||1.05));
 if(now){target.copy(c);sph.r=dist;flyTo=null;}else flyTo={t:c,r:dist,k:0,t0:target.clone(),r0:sph.r};}
function fit(now){flyToBox(bboxOf(u=>u.vis&&!u.ghost||u.vis&&expl),1.05,now);}
const ptr=new Map();let drag=null;
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 drag={moved:0,pan:e.button===2||e.shiftKey||e.button===1,pinch:null};flyTo=null;});
cv.addEventListener("pointermove",e=>{
 if(ptr.has(e.pointerId)){const p=ptr.get(e.pointerId);const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptr.size===1&&drag){drag.moved+=Math.abs(dx)+Math.abs(dy);
   if(drag.pan)pan(dx,dy);else{sph.th-=dx*0.006;sph.ph=Math.min(3.05,Math.max(0.08,sph.ph-dy*0.006));}}
  else if(ptr.size===2&&drag){const [a,b]=[...ptr.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
   if(drag.pinch){sph.r=Math.min(20,Math.max(0.15,sph.r*drag.pinch.d/d));pan(mx-drag.pinch.mx,my-drag.pinch.my);}
   drag.pinch={d,mx,my};drag.moved+=10;}
 }else hover(e);});
function end(e){const was=ptr.has(e.pointerId);ptr.delete(e.pointerId);
 if(was&&drag&&drag.moved<6&&ptr.size===0&&!drag.pan)pick(e);if(ptr.size===0)drag=null;else if(drag)drag.pinch=null;}
cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",e=>{ptr.delete(e.pointerId);drag=null;});
cv.addEventListener("wheel",e=>{e.preventDefault();sph.r=Math.min(20,Math.max(0.15,sph.r*Math.exp(e.deltaY*0.0012)));},{passive:false});
function pan(dx,dy){const k=sph.r*Math.tan(camera.fov*Math.PI/360)*2/cv.clientHeight;
 const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0),up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
 target.addScaledVector(right,-dx*k).addScaledVector(up,dy*k);}

// ---------- picking
const ray=new THREE.Raycaster();
function pickAt(e){const r=cv.getBoundingClientRect();const v=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
 ray.setFromCamera(v,camera);const objs=Object.values(meshes).filter(m=>m.visible);
 const h=ray.intersectObjects(objs,false);
 return h.find(x=>x.object.userData.info.kind==="sello")||h.find(x=>!x.object.userData.ghost)||h[0]||null;}
const tip=$("#tip");
function hover(e){if(e.pointerType==="touch")return;const h=pickAt(e);cv.style.cursor=h?"pointer":"default";
 if(h){tip.style.display="block";tip.textContent=h.object.userData.info.titulo||h.object.name;const r=stage.getBoundingClientRect();tip.style.left=(e.clientX-r.left+12)+"px";tip.style.top=(e.clientY-r.top+12)+"px";}
 else tip.style.display="none";}
function pick(e){const h=pickAt(e);if(!h){selectPiece(null);return;}
 const i=h.object.userData.info;
 if(i.kind==="sello"){goTab("juntas");openSeal(i.n);}else selectPiece(h.object.name,false);}

// ---------- screw / hole markers (spheres that ride on their piece)
const markGeo=new THREE.SphereGeometry(0.0034,12,8);
const MARKCOL={union:0xf5a300,sello:0xd62828,cable:0xe08a00,ajuste:0x8a55d6,forma:0x2e9e5b,mont:0x7b8794};
function clearMarkers(owner){const m=meshes[owner];if(!m||!m.userData.markers)return;m.userData.markers.forEach(s=>{m.remove(s);s.material.dispose();});m.userData.markers=null;}
function addMarkers(owner,pts,cat,pulse){const m=meshes[owner];if(!m||!pts)return 0;
 const col=MARKCOL[cat]||0xf5a300;m.userData.markers=m.userData.markers||[];
 pts.forEach(p=>{const s=new THREE.Mesh(markGeo,new THREE.MeshBasicMaterial({color:col,depthTest:false,transparent:true,opacity:.95}));
  s.position.set(p[0],p[1],p[2]);s.renderOrder=20;s.userData.pulse=!!pulse;m.add(s);m.userData.markers.push(s);});
 return pts.length;}
function clearAllMarkers(){for(const k in meshes)clearMarkers(k);}

// ---------- paint
let sel=null,sealMode=false,sealSel=null,stepIdx=null,expl=false,holeSel=null;
const AMBER=new THREE.Color(0xffb000);
function stepPieces(){return stepIdx==null?null:DATA.pasos[stepIdx].partes.concat(DATA.pasos[stepIdx].sellos);}
function paint(){
 const sp=stepPieces();
 for(const k in meshes){const m=meshes[k],mat=m.material,u=m.userData,i=u.info;
  let c=u.baseColor.clone(),em=0x000000,ei=0,op=u.baseOpacity,tr=u.ghost;
  const isSeal=i.kind==="sello";
  if(isSeal){
   if(sealSel!=null){if(i.n===sealSel){em=0xcc0000;ei=1;}else{op=.25;tr=true;}}
  }else if(!u.ghost){
   if(sealMode||sealSel!=null){op=.16;tr=true;
    if(sealSel!=null){const s=DATA.sellos.find(x=>x.n===sealSel);if(s&&s.partes.includes(k)){op=.5;}}}
   if(sel&&k!==sel){op=Math.min(op,.2);tr=true;}
   if(k===sel){c.lerp(AMBER,.4);em=0x4a2a00;ei=1;op=1;tr=false;}
   if(sp&&sp.includes(k)&&stepIdx!=null){em=0x0a2a55;ei=1;}
  }
  mat.color.copy(c);mat.emissive.setHex(em);mat.emissiveIntensity=ei;mat.opacity=op;mat.transparent=tr||op<1;mat.depthWrite=!(tr||op<1);}
}

// ---------- tabs and panel
const TABS=[["piezas","PIEZAS"],["juntas","JUNTAS"],["ensamble","ENSAMBLE"],["impresion","IMPRESIÓN"],["pruebas","PRUEBAS"],["resultados","RESULTADOS"]];
let tab="piezas",detail=null,filt="todas",qtext="",openSealN=null,openCase=null,openPlate=null;
const pbody=$("#pbody");
function drawTabs(){$("#tabs").innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" class="${k===tab?"on":""}">${l}</button>`).join("");}
function goTab(t){if(t!==tab){tab=t;detail=null;drawTabs();}
 if(t!=="ensamble"&&stepIdx!=null)endSteps(true);
 document.body.classList.remove("sheet-min");render();pbody.scrollTop=0;}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(b)goTab(b.dataset.tab);});
function render(){
 ({piezas:rPiezas,juntas:rJuntas,ensamble:rEnsamble,impresion:rImpresion,pruebas:rPruebas,resultados:rResultados})[tab]();
}
pbody.addEventListener("click",e=>{
 const a=e.target.closest("[data-act]");if(!a)return;const v=a.dataset.v;
 switch(a.dataset.act){
  case "piece":selectPiece(v,true);break;
  case "back":detail=null;selectPiece(null);break;
  case "filt":filt=v;render();break;
  case "seal":openSeal(+v);break;
  case "hole":toggleHole(+v);break;
  case "gotab":goTab(v);break;
  case "gocase":openCase=v;goTab("resultados");break;
  case "case":openCase=openCase===v?null:v;render();break;
  case "plate":openPlate=openPlate===v?null:v;render();break;
  case "sstart":startSteps();break;
  case "sprev":goStep(stepIdx-1);break;
  case "snext":goStep(stepIdx+1);break;
  case "sgo":goStep(+v);break;
  case "splay":togglePlay();break;
  case "send":endSteps();break;
  case "img":{const z=$("#zoom");z.querySelector("img").src=a.getAttribute("src");z.style.display="flex";break;}
 }});
$("#zoom").onclick=()=>{$("#zoom").style.display="none";};

// ----- PIEZAS
function sw(n){return `<span class="sw" style="background:${colorOf(n,P[n])}"></span>`;}
function totalsLine(items){if(items.some(i=>i.g_estimado))return `${items.length} tipos de pieza · ${nf(items.reduce((a,i)=>a+(i.g||0),0),0)} g estimados (sin datos del slicer)`;let g=0,h=0,c=0,n=0;items.forEach(i=>{n++;g+=(i.g||0);h+=(i.h||0);c+=(i.costo||0);});return `${n} tipos de pieza · ${nf(g,0)} g · ${nf(h,1)} h de impresión · S/ ${nf(c,2)}`;}
function rPiezas(){
 if(detail){rFicha(detail);return;}
 const printed=Object.keys(P).filter(n=>P[n].kind==="impresa");
 const q=qtext.trim().toLowerCase();
 const ok=n=>!q||(n+" "+P[n].titulo+" "+P[n].code+" "+(P[n].material||"")).toLowerCase().includes(q);
 let h=`<input class="search" id="q" type="search" placeholder="Buscar pieza por nombre o código…" value="${esc(qtext)}" autocomplete="off">`;
 h+=`<div class="filters">${[["todas","Todas"],["nodo","Nodo"],["boya","Boya"],["linterna","Linterna"],["tierra","Estación de tierra"],["probetas","Probetas"]].map(([k,l])=>`<button data-act="filt" data-v="${k}" class="${filt===k?"on":""}">${l}</button>`).join("")}</div>`;
 const groups=[];
 if(filt==="todas"||filt==="nodo")groups.push(["Nodo de cámaras · piezas impresas","nodo","impresa"]);
 if(filt==="todas"||filt==="boya")groups.push(["Boya · piezas impresas","boya","impresa"]);
 if(filt==="todas"||filt==="linterna")groups.push(["Linterna · aros y probeta","linterna","impresa"]);
 if(filt==="todas"||filt==="tierra")groups.push(["Estación de tierra · piezas impresas","tierra","impresa"]);
 groups.forEach(([t,g,k])=>{const ns=printed.filter(n=>P[n].group===g&&ok(n));if(!ns.length)return;
  const types={};ns.forEach(n=>{types[P[n].code]=P[n];});
  h+=`<h3>${t}</h3><div class="sum">${totalsLine(Object.values(types).filter(x=>true))} (una de cada)</div>`;
  h+=ns.map(n=>itemHTML(n)).join("");});
 if(filt==="todas"||filt==="nodo"||filt==="boya"){
  const refs=Object.keys(P).filter(n=>P[n].kind==="ref"&&(filt==="todas"||P[n].group===filt)&&ok(n));
  if(refs.length)h+=`<h3>Referencias y piezas compradas (no se imprimen)</h3>`+refs.map(itemHTML).join("");}
 if(filt==="todas"||filt==="probetas"){
  const pr=probetasList().filter(x=>!q||(x.codigo+" "+x.nombre).toLowerCase().includes(q));
  if(pr.length)h+=`<h3>Probetas (piezas de prueba, sin modelo 3D)</h3><div class="sum">Se imprimen primero. Su resultado corrige las piezas finales.</div>`+pr.map(x=>`<div class="card"><b>${esc(x.nombre)}</b> <span class="chip">${esc(x.codigo)}</span><br><span class="lead">${esc(x.nota)}</span><br><small>${x.cant} ${x.cant>1?"copias":"copia"} · ${x.g==null?"gramos y horas: pendiente (aún sin laminar)":nf(x.g,1)+" g · "+nf(x.h,2)+" h"}</small></div>`).join("");}
 if(h.indexOf("item")<0&&h.indexOf("card")<0)h+=`<div class="empty">Ninguna pieza coincide con la búsqueda.</div>`;
 pbody.innerHTML=h;
 const qi=$("#q");qi.oninput=()=>{qtext=qi.value;const pos=qi.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos);};
}
function probetasList(){const out=[];(DATA.impresion.grupos||[]).forEach(g=>{if(g.n!==1)return;g.placas.forEach(pl=>pl.piezas.forEach(p=>out.push(p)));});return out;}
function itemHTML(n){const i=P[n];
 const extra=i.kind==="impresa"?(i.g_estimado?`${nf(i.g)} g (estimado)`:`${nf(i.g)} g · ${nf(i.h,2)} h · S/ ${nf(i.costo,2)}`):(i.g!=null?nf(i.g,0)+" g":"");
 return `<div class="item${n===sel?" sel":""}" data-act="piece" data-v="${n}">${sw(n)}<div class="t"><b>${esc(i.titulo)}</b><small>${esc(n)}${extra?" · "+extra:""}</small></div>${(i.sellos||[]).length?`<span class="badge">junta</span>`:""}</div>`;}
const CATN={union:"Tornillo o unión",ajuste:"Alineación",cable:"Cable",sello:"Junta contra el agua",forma:"Forma o ahorro de material",mont:"Montaje interno",montaje:"Montaje interno"};
function rFicha(n){
 const i=P[n];
 let h=`<button class="btn small back" data-act="back">← Volver a la lista</button>`;
 h+=`<h2>${esc(i.titulo)}</h2><span class="chip">${esc(i.code)}</span><span class="chip">${({nodo:"Nodo de cámaras",boya:"Boya",linterna:"Linterna",tierra:"Estación de tierra"})[i.group]||i.group}</span>`;
 h+=i.kind==="impresa"?`<span class="chip">Se imprime en 3D</span>`:`<span class="chip">No se imprime</span>`;
 (i.sellos||[]).forEach(k=>h+=`<span class="chip red">Junta ${k}</span>`);
 if(i.aviso)h+=`<div class="card red"><b>Aviso:</b> ${esc(i.aviso)}</div>`;
 h+=`<p>${esc(i.funcion)}</p>`;
 h+=`<dl><dt>Material</dt><dd>${esc(i.material)}</dd>`;
 if(i.g!=null){h+=`<dt>Peso</dt><dd>${nf(i.g)} g${i.g_estimado?" (estimado)":""}${i.kind==="impresa"?" cada una":""}</dd>`;}
 if(i.h!=null)h+=`<dt>Tiempo</dt><dd>${nf(i.h,2)} h de impresión cada una</dd>`;
 if(i.costo!=null)h+=`<dt>Costo</dt><dd>S/ ${nf(i.costo,2)} cada una <small class="lead">(gramos × S/ ${nf(DATA.precio_kg,0)} por kg)</small></dd>`;
 if(i.kind==="impresa"&&i.qty>1&&i.costo==null)h+=`<dt>Cantidad</dt><dd>${i.qty} en total · ${nf(i.g*i.qty,0)} g${i.g_estimado?" (estimado)":""}</dd>`;
 else if(i.kind==="impresa"&&i.qty>1)h+=`<dt>Cantidad</dt><dd>${i.qty} en total · S/ ${nf(i.costo*i.qty,2)} · ${nf(i.g*i.qty,0)} g · ${nf(i.h*i.qty,1)} h</dd>`;
 if(i.relleno!=null)h+=`<dt>Relleno</dt><dd>${i.relleno} %${i.paredes?` · ${i.paredes} paredes`:""}${i.soportes?" · lleva soportes":" · sin soportes"}${i.estanca?" · perfil estanco":""}</dd>`;
 if(i.orient)h+=`<dt>En la cama</dt><dd>${esc(i.orient)}</dd>`;
 if(i.paso!=null)h+=`<dt>Se arma en</dt><dd>Paso ${i.paso+1}: ${esc(DATA.pasos[i.paso].titulo)}</dd>`;
 h+=`</dl>`;
 if(i.nota_g)h+=`<p class="lead">${esc(i.nota_g)}</p>`;
 if(i.une)h+=`<h3>Se une a</h3><p>${esc(i.une)}</p>`;
 if((i.tornillos&&i.tornillos.length)||(i.insertos&&i.insertos.length)){
  h+=`<h3>Tornillos e insertos</h3>`;
  if(i.tornillos&&i.tornillos.length)h+=`<ul>${i.tornillos.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`;
  if(i.insertos&&i.insertos.length)h+=`<p class="lead">Insertos roscados (tuercas de latón que se funden en el plástico):</p><ul>${i.insertos.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`;}
 if(i.sellos&&i.sellos.length){h+=`<h3>Juntas de esta pieza</h3>`+i.sellos.map(k=>{const s=DATA.sellos.find(x=>x.n===k);return s?`<div class="card red"><div class="hd" data-act="seal" data-v="${k}"><span class="num red">${k}</span><div><b>${esc(s.sello)}</b><small>${esc(s.tipo)}</small></div></div></div>`:"";}).join("");}
 if(i.resultados&&i.resultados.length){h+=`<h3>Simulación</h3>`+i.resultados.map(id=>{const c=DATA.resultados.casos.find(x=>x.id===id);return c?`<div class="card"><div class="hd" data-act="gocase" data-v="${id}"><div><b>${esc(c.titulo)}</b><small>Margen de seguridad ${fsHTML(c)}</small></div></div></div>`:"";}).join("");}
 else if(i.kind==="impresa")h+=`<h3>Simulación</h3><p class="lead">Pendiente: esta pieza todavía no tiene simulación publicada.</p>`;
 if(i.rasgos&&i.rasgos.length){h+=`<h3>Cada agujero y cada forma</h3><p class="lead">${i.marcas3d?"Toca uno para verlo marcado en el modelo.":"La posición exacta en el modelo 3D todavía no se puede marcar para esta pieza."}</p>`;
  i.rasgos.forEach(r=>{const c=r.cat==="montaje"?"mont":r.cat;h+=`<div class="hole${holeSel===r.n?" on":""}" data-act="hole" data-v="${r.n}"><div class="n c-${c==="union"?"u":c}">${r.n}</div><div><b>${esc(r.tipo)}${r.diam?" · Ø"+esc(r.diam):""}${r.cant>1?" · ×"+r.cant:""}</b><span>${esc(r.texto)}</span><br><small class="lead">${esc(CATN[r.cat]||r.cat||"")}</small></div></div>`;});}
 else if(i.rasgos_nota)h+=`<h3>Cada agujero y cada forma</h3><p class="lead">${esc(i.rasgos_nota)}</p>`;
 pbody.innerHTML=h;
}
function selectPiece(name,fly){
 if(sel&&sel!==name)clearMarkers(sel);
 sel=name;holeSel=null;
 if(name){detail=name;if(tab!=="piezas"){tab="piezas";drawTabs();}document.body.classList.remove("sheet-min");}else detail=null;
 if(tab==="piezas")render();paint();
 if(name&&fly!==false){const m=meshes[name];if(m)flyToBox(bboxOf(null,[name]),1.5);}
}
function toggleHole(n){const i=P[sel];if(!i)return;clearMarkers(sel);
 if(holeSel===n){holeSel=null;}else{holeSel=n;const r=i.rasgos.find(x=>x.n===n);if(r&&r.pts){addMarkers(sel,r.pts,r.cat==="montaje"?"mont":r.cat,true);
   const b=new THREE.Box3();r.pts.forEach(p=>b.expandByPoint(new THREE.Vector3(p[0],p[1],p[2]).addScaledVector(meshes[sel].userData.off,meshes[sel].userData.uT)));
   b.expandByScalar(.03);flyToBox(b,1.2);}}
 render();}

// ----- JUNTAS
function openSeal(n){
 if(tab!=="juntas"){tab="juntas";drawTabs();}
 openSealN=openSealN===n?null:n;sealSel=openSealN;
 document.body.classList.remove("sheet-min");
 paint();render();
 if(sealSel!=null){const s=DATA.sellos.find(x=>x.n===n);const names=(s&&s.mallas)||[];
  if(names.length)flyToBox(bboxOf(null,names),1.8);else if(s&&s.partes.length)flyToBox(bboxOf(null,s.partes),1.4);}
 const c=pbody.querySelector(".card.sel");if(c)c.scrollIntoView({block:"nearest"});
}
function rJuntas(){
 let h=`<h2>Juntas contra el agua</h2><p class="lead">${DATA.sellos.length} juntas. Toca una para verla en rojo en el modelo y leer cómo se pone y cómo se prueba. Los anillos rojos del modelo están dibujados en su lugar aproximado.</p>`;
 DATA.sellos.forEach(s=>{const o=s.n===openSealN;
  h+=`<div class="card red${o?" sel":""}"><div class="hd" data-act="seal" data-v="${s.n}"><span class="num red">${s.n}</span><div><b>${esc(s.sello)}</b><small>${esc(s.tipo)}</small>${s.cant?`<small>${esc(s.cant)} · ${s.zona==="boya"?"boya":"nodo"}</small>`:`<small>${s.zona==="boya"?"boya":"nodo"}</small>`}</div></div>`;
  if(o){h+=`<h3>Qué protege</h3><p>${esc(s.protege)}</p><h3>Pieza que se compra</h3><p>${esc(s.comercial)}</p>`;
   if(s.instalar.length)h+=`<h3>Cómo se instala</h3><ol>${s.instalar.map(t=>`<li>${esc(t)}</li>`).join("")}</ol>`;
   if(s.probar.length)h+=`<h3>Cómo se prueba</h3><ol>${s.probar.map(t=>`<li>${esc(t)}</li>`).join("")}</ol>`;
   h+=`<p><button class="btn small" data-act="gotab" data-v="pruebas">Ver el protocolo de pruebas</button></p>`;
   if(s.partes.length)h+=`<h3>Piezas que toca</h3><div>${[...new Set(s.partes)].map(p=>`<span class="chip" style="cursor:pointer" data-act="piece" data-v="${p}">${esc(p)}</span>`).join("")}</div>`;
   if(s.donde.length)h+=`<p class="lead">Dónde verlo en la guía de piezas: ${esc(s.donde.join(" · "))}</p>`;
   if(!s.mallas.length)h+=`<p class="lead">Esta junta no tiene dibujo propio en el modelo: se reconoce por las piezas que toca.</p>`;}
  h+=`</div>`;});
 if(DATA.no_estanco.length)h+=`<h3>Lo que NO es estanco, a propósito</h3><ul>${DATA.no_estanco.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`;
 if(DATA.pendiente.length)h+=`<h3>Por confirmar en las pruebas</h3><ul>${DATA.pendiente.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`;
 pbody.innerHTML=h;
}

// ----- ENSAMBLE
let playT=null;
function togglePlay(){if(playT){clearInterval(playT);playT=null;}else{if(stepIdx==null)startSteps();playT=setInterval(()=>{if(stepIdx>=DATA.pasos.length-1){togglePlay();render();}else goStep(stepIdx+1);},3800);}render();}
function startSteps(){expl=false;$("#bExp").classList.remove("on");selectPiece(null);goStep(0);}
function endSteps(quiet){if(playT){clearInterval(playT);playT=null;}stepIdx=null;clearAllMarkers();applyTargets();paint();if(!quiet){fit(false);render();}}
function applyTargets(){for(const k in meshes){const u=meshes[k].userData,i=u.info;let vis=true,uT=expl?1:0;
  if(stepIdx!=null){vis=(i.paso==null)||i.paso<=stepIdx;uT=0;}
  u.vis=vis;u.uT=uT;}}
function goStep(i){i=Math.max(0,Math.min(DATA.pasos.length-1,i));
 clearAllMarkers();stepIdx=i;sel=null;detail=null;holeSel=null;
 if(tab!=="ensamble"){tab="ensamble";drawTabs();}
 applyTargets();const s=DATA.pasos[i];
 s.partes.concat(s.sellos).forEach(n=>{const u=meshes[n].userData;u.u=1;u.uT=0;});
 // screws of this step appear on their piece
 s.tornillos.forEach(t=>{const r=P[t.pieza].rasgos.find(x=>x.n===t.n);if(r&&r.pts)addMarkers(t.pieza,r.pts,"union",true);});
 paint();flyToBox(bboxOf(u=>u.vis&&!u.ghost||u.vis&&u.info.paso!=null&&u.info.paso<=stepIdx),1.1);
 render();}

 const S=DATA.pasos;let h=`<h2>Cómo se arma</h2>`;
 if(stepIdx==null){
  h+=`<p class="lead">${S.length} pasos. Cada paso mueve sus piezas hasta su lugar y marca en naranja los tornillos que van ahí.</p><div class="row"><button class="btn on" data-act="sstart">▶ Armar paso a paso</button></div>`;
  h+=`<h3>Los pasos</h3>`+S.map((s,i)=>`<div class="item" data-act="sgo" data-v="${i}"><span class="num">${i+1}</span><div class="t"><b>${esc(s.titulo)}</b><small>${({boya:"boya",linterna:"linterna",tierra:"estación de tierra"})[s.grupo]||"nodo"} · ${s.partes.length} pieza${s.partes.length>1?"s":""}${s.tornillos.length?" · tornillos":""}</small></div></div>`).join("");
 }else{
  const s=S[stepIdx];
  h+=`<div class="bar"><i style="width:${(stepIdx+1)/S.length*100}%"></i></div>`;
  h+=`<div class="stepbox"><h4>Paso ${stepIdx+1} de ${S.length}: ${esc(s.titulo)}</h4><p>${esc(s.texto)}</p>${s.aviso?`<div class="card red"><b>Aviso:</b> ${esc(s.aviso)}</div>`:""}`;
  h+=`<div class="row"><button class="btn" data-act="sprev" ${stepIdx===0?"disabled":""}>← Anterior</button><button class="btn on" data-act="snext" ${stepIdx===S.length-1?"disabled":""}>Siguiente →</button><button class="btn" data-act="splay">${playT?"⏸ Pausa":"▶ Automático"}</button><button class="btn" data-act="sgo" data-v="${stepIdx}">↻ Repetir</button><button class="btn" data-act="send">Salir</button></div></div>`;
  h+=`<h3>Piezas que entran</h3><div>${s.partes.map(p=>`<span class="chip" style="cursor:pointer" data-act="piece" data-v="${p}">${esc(p)}</span>`).join("")}</div>`;
  if(s.sellos.length){const ns=[...new Set(s.sellos.map(m=>P[m].n))];h+=`<h3>Juntas de este paso</h3><div>${ns.map(n=>`<span class="chip red" style="cursor:pointer" data-act="seal" data-v="${n}">Junta ${n}</span>`).join("")}</div>`;}
  if(s.tornillos.length){h+=`<h3>Tornillos de este paso (los puntos naranja)</h3><ul>`+s.tornillos.map(t=>`<li>${esc(t.tipo)}${t.diam?" · Ø"+esc(t.diam):""} ×${t.cant} <small class="lead">en ${esc(t.pieza)}${t.tiene3d?"":" (sin marca 3D)"}</small></li>`).join("")+`</ul>`;}
  else h+=`<p class="lead">Este paso no lleva tornillos propios.</p>`;
  h+=`<h3>Todos los pasos</h3>`+S.map((x,i)=>`<div class="item${i===stepIdx?" sel":""}" data-act="sgo" data-v="${i}"><span class="num">${i+1}</span><div class="t"><b>${esc(x.titulo)}</b></div></div>`).join("");
 }
 h+=`<details><summary>Lista de compra: nodo</summary><table><tr><th>Qué</th><th>Medida</th><th>Cant.</th></tr>${(DATA.herraje.nodo||[]).map(x=>`<tr><td>${esc(x.item)}</td><td>${esc(x.medida)}</td><td>${esc(x.cant)}</td></tr>`).join("")||"<tr><td colspan=3>No disponible en esta corrida.</td></tr>"}</table></details>`;
 if((DATA.herraje.tierra||[]).length)h+=`<details><summary>Lista de compra: estación de tierra</summary><table><tr><th>Qué</th><th>Medida</th><th>Cant.</th></tr>${DATA.herraje.tierra.map(x=>`<tr><td>${esc(x.item)}</td><td>${esc(x.medida)}</td><td>${esc(x.cant)}</td></tr>`).join("")}</table></details>`;
 h+=`<details><summary>Lista de compra: boya</summary><table><tr><th>Qué</th><th>Medida</th><th>Cant.</th></tr>${(DATA.herraje.boya||[]).map(x=>`<tr><td>${esc(x.item)}</td><td>${esc(x.medida)}</td><td>${esc(x.cant)}</td></tr>`).join("")}</table></details>`;
 pbody.innerHTML=h;
}

// ----- IMPRESIÓN
function rImpresion(){
 const I=DATA.impresion,pf=I.perfil_estanco;
 let h=`<h2>Qué imprimir y en qué orden</h2><p class="lead">Impresora Bambu P1P, boquilla 0.4, PETG opaco. Precio del filamento: S/ ${nf(DATA.precio_kg,0)} por kg. El costo de cada pieza es sus gramos × ese precio.</p>`;
 h+=`<div class="card"><b>Nodo:</b> ${nf(DATA.totales.nodo.g,0)} g · ${nf(DATA.totales.nodo.h,1)} h · S/ ${nf(DATA.totales.nodo.costo,2)}<br><b>Boya:</b> ${nf(DATA.totales.boya.g,0)} g · ${nf(DATA.totales.boya.h,1)} h · S/ ${nf(DATA.totales.boya.costo,2)}<br><small class="lead">Las probetas no suman: aún no tienen gramos calculados.</small></div>`;
 h+=`<div class="card"><b>Perfil de Orca</b><br><small>Proceso <code>${esc((I.perfiles_orca.find(x=>/Standard/.test(x))||"0.20mm_Standard_P1P").replace(/_/g," "))}</code> · filamento <code>${esc((I.perfiles_orca.find(x=>/PETG/.test(x))||"Bambu_PETG_Basic").replace(/_/g," "))}</code> · máquina <code>${esc((I.perfiles_orca.find(x=>/nozzle/.test(x))||"P1P_0.4_nozzle").replace(/_/g," "))}</code></small><br>`
  +`<b>Perfil estanco</b> (piezas ${pf.piezas.map(esc).join(", ")}): <b>${pf.perimetros} paredes</b>, <b>${pf.capas_arriba} capas arriba</b> y <b>${pf.capas_abajo} abajo</b>, relleno <b>${pf.relleno} %</b>.</div>`;
 I.grupos.forEach(g=>{
  h+=`<h3>${g.n}. ${esc(g.titulo)}</h3><p class="lead">${esc(g.nota)}</p>`;
  if(g.pendiente){h+=`<div class="card"><b>Pendiente</b><br><small class="lead">Todavía no hay placas calculadas para este grupo.</small></div>`;return;}
  h+=`<div class="sum">${g.placas.length} placa${g.placas.length>1?"s":""} · ${g.g?nf(g.g,0)+" g · "+nf(g.h,1)+" h · S/ "+nf(g.costo,2):"gramos y horas pendientes"}</div>`;
  g.placas.forEach(pl=>{const o=openPlate===pl.nombre;
   h+=`<div class="card${o?" sel":""}"><div class="hd" data-act="plate" data-v="${esc(pl.nombre)}"><div><b>${esc(pl.nombre.replace(/_/g," "))}</b><small>${pl.piezas.map(p=>esc(p.codigo)+" ×"+p.cant).join(" · ")}</small></div></div>`;
   h+=`<div style="margin-top:6px"><span class="chip">relleno ${pl.relleno} %</span><span class="chip">${pl.paredes} paredes</span><span class="chip ${pl.soportes?"warn":""}">${pl.soportes?"con soportes":"sin soportes"}</span>${pl.estanca?`<span class="chip red">perfil estanco</span>`:""}${pl.incompleta?`<span class="chip">gramos pendientes</span>`:`<span class="chip">${nf(pl.g,0)} g · ${nf(pl.h,1)} h · S/ ${nf(pl.costo,2)}</span>`}</div>`;
   if(o){pl.piezas.forEach(p=>{h+=`<div style="margin-top:8px;border-top:1px solid var(--line);padding-top:6px"><b>${esc(p.nombre)}</b> <span class="chip">×${p.cant}</span> ${p.g==null?`<span class="chip">pendiente</span>`:`<small class="lead">${nf(p.g,1)} g · ${nf(p.h,2)} h cada una</small>`}`
     +(p.nota?`<br><small class="lead">${esc(p.nota)}</small>`:"")+(p.orient?`<br><small>En la cama: ${esc(p.orient)}</small>`:"")+`</div>`;});
    if(pl.estanca)h+=`<h3>Para que salga estanca</h3><ul>${I.tips_estanca.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`;}
   h+=`</div>`;});});
 h+=`<h3>Consejos generales</h3><ul>${I.tips_generales.map(t=>`<li>${esc(t)}</li>`).join("")}</ul><h3>Para que las piezas estancas salgan estancas</h3><ul>${I.tips_estanca.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`;
 pbody.innerHTML=h;
}

// ----- PRUEBAS
function blocks(bs){return (bs||[]).map(b=>{
 if(b.t==="h3")return `<h3>${b.html}</h3>`;
 if(b.t==="p")return `<p>${b.html}</p>`;
 if(b.t==="ol")return `<ol>${b.items.map(x=>`<li>${x}</li>`).join("")}</ol>`;
 if(b.t==="ul")return `<ul>${b.items.map(x=>`<li>${x}</li>`).join("")}</ul>`;
 if(b.t==="table")return `<table>${b.rows.map((r,i)=>`<tr>${r.map(c=>i===0?`<th>${c}</th>`:`<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;
 return "";}).join("");}
function rPruebas(){
 const Q=DATA.pruebas;
 let h=`<h2>Cómo probar que no entra agua</h2><p class="lead">Regla de oro: <b>nunca</b> ponga electrónica en una prueba de agua. Adentro va papel de cocina seco: si al abrir sigue seco, la junta aguantó.</p>`;
 h+=`<h3>El orden</h3>`+blocks(Q.antes);
 h+=`<h3>Guía paso a paso</h3>`+blocks(Q.guia);
 h+=`<h3>Cómo comparar dos impresiones</h3>`+blocks(Q.comparar);
 h+=`<h3>Qué mirar en la pieza impresa</h3>`+blocks(Q.mirar);
 h+=`<h3>Para que la impresión salga estanca</h3>`+blocks(Q.imprimir);
 h+=`<h3>Por confirmar en las pruebas</h3>`+blocks(Q.pendiente);
 pbody.innerHTML=h;
}

// ----- RESULTADOS
function fsClass(c){return c.cumple===true?"ok":(c.cumple===false?"bad":"warn");}
function fsHTML(c){if(c.fs==null)return `<span class="fs warn">pendiente</span>`;return `<span class="fs ${fsClass(c)}">${nf(c.fs,2)}${c.cumple===true?" · cumple":c.cumple===false?" · NO cumple":""}</span>`;}
const IMGN={vonmises:"Esfuerzo (qué zonas sufren más)",desplazamiento:"Cuánto se deforma",condiciones:"Dónde se apoya y dónde se carga",malla:"Malla de cálculo"};
function rResultados(){
 const R=DATA.resultados;let h=`<h2>Resultados de la simulación</h2>`;
 if(!R.disponible){h+=`<div class="card"><b>Pendiente</b><br><small class="lead">${esc(R.nota)}</small></div>`;pbody.innerHTML=h;return;}
 h+=`<p class="lead">Se simuló cada pieza con la carga que más la exige. El <b>margen de seguridad</b> dice cuántas veces cabe el límite del material (50 MPa para el PETG) en el esfuerzo máximo: <b>2 o más cumple</b>, entre 1 y 2 es justo, menos de 1 no cumple.</p>`;
 if(R.nota)h+=`<p class="lead">${esc(R.nota)}</p>`;
 R.casos.forEach(c=>{const o=openCase===c.id;
  h+=`<div class="card${o?" sel":""}"><div class="hd" data-act="case" data-v="${esc(c.id)}"><div><b>${esc(c.id.replace(/_/g," "))}</b><small>${esc(c.titulo||"")}</small><small>Margen de seguridad: ${fsHTML(c)} · deformación máx. ${nf(c.umax_mm,2)} mm</small></div></div>`;
  if(o){h+=`<dl><dt>Esfuerzo máximo</dt><dd>${nf(c.sigma_max)} MPa <small class="lead">(un solo punto de la malla)</small></dd>`
    +(c.sigma_p995!=null?`<dt>Sin los picos</dt><dd>${nf(c.sigma_p995)} MPa · margen ${nf(c.fs_p995,1)}</dd>`:"")
    +(c.fs_capas!=null?`<dt>Entre capas</dt><dd>margen ${nf(c.fs_capas,2)} <small class="lead">(la unión entre capas aguanta la mitad)</small></dd>`:"")
    +`<dt>Calculado con</dt><dd>${esc(c.fuente||"—")}${c.motivo?` <small class="lead">(${esc(c.motivo)})</small>`:""}</dd></dl>`;
   const ks=Object.keys(c.imagenes||{});
   if(ks.length)h+=`<div class="imgs">${["vonmises","desplazamiento","condiciones","malla"].filter(k=>c.imagenes[k]).map(k=>`<figure><img data-act="img" onerror="this.alt='imagen no disponible';this.style.minHeight='40px'" src="${esc(c.imagenes[k])}" alt="${esc(IMGN[k])}" loading="lazy"><figcaption>${IMGN[k]}</figcaption></figure>`).join("")}</div>`;
   else h+=`<p class="lead">Imágenes pendientes.</p>`;
   (c.notas||[]).forEach(t=>h+=`<p class="lead">${esc(t)}</p>`);
   if(c.link)h+=`<p><a href="${esc(c.link)}" target="_blank" rel="noopener">Abrir en SimScale ↗</a></p>`;
   const pc=Object.keys(P).find(n=>P[n].code===c.pieza);if(pc)h+=`<p><button class="btn small" data-act="piece" data-v="${pc}">Ver la pieza</button></p>`;}
  h+=`</div>`;});
 const done=new Set(R.casos.map(c=>c.pieza));const miss=[...new Set(Object.values(P).filter(i=>i.kind==="impresa").map(i=>i.code))].filter(c=>![...done].some(d=>d===c||d.startsWith(c)));
 if(miss.length)h+=`<h3>Sin simulación todavía</h3><div>${miss.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div><p class="lead">Pendiente.</p>`;
 if(R.capacidad&&R.capacidad.length){h+=`<h3>Cuánto aguanta en el mar</h3><p class="lead">«Aguanta hasta» es la fuerza con la que las capas de la impresión empezarían a despegarse. Lo seguro es un tercio de eso.</p>`;
  R.capacidad.forEach(c=>{h+=`<div class="card"><b>${esc(c.caso)}</b><small>${esc(c.piezas)} · carga de prueba ${nf(c.carga_N,0)} N · margen entre capas ${nf(c.fs_capas,2)}</small><dl><dt>Aguanta hasta</dt><dd>${nf(c.aguanta_N,0)} N</dd><dt>Seguro hasta</dt><dd>${nf(c.segura_N,0)} N</dd><dt>En el mar</dt><dd>${esc(c.equivalente)}</dd></dl></div>`;});}
 if(R.convenciones)h+=`<p class="lead"><small>${esc(R.convenciones)}</small></p>`;
 pbody.innerHTML=h;
}

// ---------- header buttons
const bExp=$("#bExp"),bSel=$("#bSel");
bExp.onclick=()=>{if(stepIdx!=null)endSteps(true);expl=!expl;bExp.classList.toggle("on",expl);bExp.textContent=expl?"Armar":"Explotar";applyTargets();fit(false);if(tab==="ensamble")render();};
bSel.onclick=()=>{sealMode=!sealMode;bSel.classList.toggle("on",sealMode);paint();};
$("#bVista").onclick=()=>{if(stepIdx!=null)endSteps(true);if(sel)clearMarkers(sel);sel=null;detail=null;sealSel=null;openSealN=null;holeSel=null;expl=false;bExp.classList.remove("on");bExp.textContent="Explotar";applyTargets();paint();fit(false);render();};
$("#bTema").onclick=()=>setTheme(root.dataset.theme==="dark"?"light":"dark");
$("#sheetbtn").onclick=()=>document.body.classList.toggle("sheet-min");

// ---------- loop
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);addEventListener("resize",resize);
let last=performance.now(),firstDone=false,lg;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
 for(const k in meshes){const m=meshes[k],u=m.userData;u.u+=(u.uT-u.u)*Math.min(1,dt*4.5);if(Math.abs(u.uT-u.u)<.0005)u.u=u.uT;
  m.position.copy(u.base).addScaledVector(u.off,u.u);m.visible=u.vis;
  if(u.markers){const s=1+.35*Math.sin(now/220);u.markers.forEach(x=>x.scale.setScalar(x.userData.pulse?s:1));}}
 if(flyTo){flyTo.k=Math.min(1,flyTo.k+dt*2.2);const e=flyTo.k<.5?2*flyTo.k*flyTo.k:1-Math.pow(-2*flyTo.k+2,2)/2;
  target.lerpVectors(flyTo.t0,flyTo.t,e);sph.r=flyTo.r0+(flyTo.r-flyTo.r0)*e;if(flyTo.k>=1)flyTo=null;}
 placeCam();renderer.render(scene,camera);
 if(!firstDone){firstDone=true;lg.loadMs=Math.round(performance.now());lg.loadMsApp=Math.round(performance.now()-T0);}}

// ---------- boot
async function boot(){
 let buf;
 if(MODE==="embedded"){buf=b64bytes(GLB_B64);}
 else{
  const [d,b]=await Promise.all([fetch("datos.json").then(r=>{if(!r.ok)throw new Error("datos.json "+r.status);return r.json();}),fetch("modelo.glb").then(r=>{if(!r.ok)throw new Error("modelo.glb "+r.status);return r.arrayBuffer();})]);
  DATA=d;buf=new Uint8Array(b);}
 P=DATA.piezas;
 build(buf);
 msg.style.display="none";
 lg=window.__lg={select:selectPiece,goStep,goTab,openSeal,meshes,DATA,setTheme,loadMs:null,mode:MODE,state:()=>({tab,sel,stepIdx,expl,sealSel})};
 drawTabs();resize();applyTargets();fit(true);paint();render();
 requestAnimationFrame(frame);
}
boot().catch(e=>{console.error(e);fail("No se pudo cargar el manual: "+e.message+(MODE!=="embedded"?". Si abriste index.html con doble clic, usa LanternGuard_visor.html o sirve la carpeta con un servidor web.":""));});
})();
</script>
